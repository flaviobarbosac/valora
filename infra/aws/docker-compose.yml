# VALORA on the shared EC2 (/opt/valora). Separate compose project from Clampfy:
# own network, no published ports, hard memory limits, and the highest OOM score so
# the kernel stops VALORA before any Clampfy container if memory ever runs out.
name: valora

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  valora:
    image: ${VALORA_IMAGE}
    container_name: valora-app
    restart: unless-stopped
    logging: *default-logging
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      NODE_OPTIONS: --max-old-space-size=256
    mem_limit: 384m
    memswap_limit: 384m
    cpus: 0.75
    oom_score_adj: 1000
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks: [valora]

  cloudflared:
    image: cloudflare/cloudflared:2025.10.0
    container_name: valora-tunnel
    restart: unless-stopped
    logging: *default-logging
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    mem_limit: 96m
    memswap_limit: 96m
    cpus: 0.25
    oom_score_adj: 1000
    depends_on: [valora]
    networks: [valora]
    profiles: [tunnel]

networks:
  valora:
    name: valora
